[project]
name = "colemorton"
version = "0.1.0"
description = "Multi-modal platform combining Python data processing and Astro frontend for trading strategy analysis"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
    "frontend",
]

[tool.ruff.lint]
# Enable core rule sets
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
]

# Ignore specific rules to match existing flake8 configuration
ignore = [
    "E402",   # Module level import not at top of file
]

# Allow fix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Format docstrings
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
# isort-compatible import sorting
known-first-party = ["scripts"]
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2

[tool.mypy]
# MyPy configuration for Colemorton platform
# Enforces type safety across Python data processing pipeline
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = true
show_error_codes = true
show_column_numbers = true

# Allow for gradual typing adoption
ignore_missing_imports = true
no_strict_optional = true

# Files to check
files = ["scripts/"]

# Exclude test files during initial rollout
exclude = [
    "^scripts/test_.*\\.py$",
    "^scripts/.*test.*\\.py$",
    "^scripts/tests/.*\\.py$",
    "^scripts/.*_test\\.py$"
]

# Strict checking for well-typed modules
[[tool.mypy.overrides]]
module = "scripts.utils.config_validator"
disallow_untyped_defs = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "scripts.utils.chart_generator_factory"
disallow_untyped_defs = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "scripts.utils.dashboard_parser"
disallow_untyped_defs = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "scripts.services.base_financial_service"
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "scripts.utils.*"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "scripts.services.*"
ignore_missing_imports = false

# Third-party library configurations
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "plotly.*",
    "matplotlib.*",
    "numpy.*",
    "scipy.*",
    "sklearn.*",
    "requests.*",
    "yaml.*",
    "pydantic.*",
    "structlog.*",
    "sqlalchemy.*",
    "pymongo.*",
    "psycopg2.*",
    "pytest.*",
    "kaleido.*",
    "pillow.*",
    "openpyxl.*",
    "xlrd.*",
    "jsonschema.*",
    "cerberus.*",
    "python-dateutil.*",
    "python-dotenv.*",
    "markdown.*"
]
ignore_missing_imports = true

[tool.bandit]
# Bandit security scanning configuration
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "node_modules"
]

# Skip specific tests
skips = [
    "B404",  # Import of subprocess module
    "B603",  # subprocess without shell equals true
    "B607"   # Starting a process with a partial executable path
]

# Exclude test files from certain checks
[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests/*"]
